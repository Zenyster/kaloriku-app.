    :root {

      --dark-text: #1e293b;
      --bg-light: #f0fdf4;
      --card-bg: #ffffff;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    
    body { 
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
      background-color: var(--bg-light); 
      padding: 24px 15px; 
      margin: 0; 
      color: var(--dark-text); 
    }

    .card { 
      background: var(--card-bg); 
      padding: 24px 20px; 
      border-radius: 20px; 
      box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.12); 
      max-width: 480px; 
      margin: 0 auto; 
      border: 1px solid #d1fae5;
    }

    h1 { 
      font-family: 'Poppins', sans-serif;
      font-size: 26px; 
      font-weight: 800; 
      text-align: center; 
      margin: 0 0 20px 0; 
      color: var(--primary); 
      letter-spacing: 1px; 
    }
    
    .mode-container {
      display: flex;
      gap: 4px;
      margin-bottom: 18px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      align-items: center;
    }

    .mode-btn {
      flex: 1;
      height: 40px;
      padding: 0 4px;
      font-family: 'Poppins', sans-serif;
      font-size: 11px;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
      transition: all 0.2s ease;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .mode-btn.active {
      background-color: var(--primary) !important;
      color: #ffffff !important;
      font-weight: 700;
      box-shadow: 0 3px 6px rgba(16, 185, 129, 0.25);
    }

    label { 
      font-family: 'Poppins', sans-serif;
      font-weight: 600; 
      font-size: 13px; 
      color: var(--dark-text); 
      display: block; 
      margin-top: 14px; 
      margin-bottom: 6px; 
    }
    
    select, textarea { 
      width: 100%; 
      padding: 12px 14px; 
      border-radius: 12px; 
      border: 1.5px solid #cbd5e1; 
      font-size: 14px; 
      font-family: inherit;
      outline: none; 
      background-color: #ffffff; 
      color: var(--dark-text);
      transition: border 0.2s;
      -webkit-appearance: none;
    }

    select:focus, textarea:focus {
      border-color: var(--primary);
    }

    textarea { height: 85px; resize: none; }

    .btn-hitung { 
      width: 100%;
      background-color: var(--primary); 
      color: #ffffff; 
      font-family: 'Poppins', sans-serif;
      font-weight: 700; 
      border: none; 
      margin-top: 18px; 
      font-size: 15px; 
      border-radius: 12px; 
      cursor: pointer; 
      padding: 14px;
      text-align: center;
      transition: background-color 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.25);
    }

    .btn-hitung:active { background-color: var(--primary-dark); }
    
    .result-section { 
      margin-top: 22px; 
      padding: 18px; 
      border-radius: 16px; 
      background: #f8fafc; 
      border: 1.5px solid #e2e8f0; 
      display: none; 
    }

    .badge { display: inline-block; padding: 7px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; margin-top: 8px; }
    .badge-safe { background: #d1fae5; color: #065f46; }
    .badge-over { background: #fee2e2; color: #991b1b; }
    .badge-under { background: #e0f2fe; color: #0369a1; }

    .breakdown-box { margin-top: 14px; background: #ffffff; border-radius: 12px; padding: 14px; border: 1px solid #e2e8f0; }
    .breakdown-box ul { margin: 6px 0 0 0; padding-left: 0; list-style: none; } 
    .breakdown-box li { display: flex; justify-content: space-between; font-size: 13px; padding: 6px 0; border-bottom: 1px dashed #f1f5f9; }
    
    .suggestion-box { margin-top: 14px; padding: 12px 14px; background: #ecfdf5; border-left: 4px solid var(--primary); border-radius: 8px; font-size: 13px; color: #064e3b; }
    .suggestion-box ul { margin: 6px 0 0 0; padding-left: 18px; }
    
    .source-text { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 16px; font-style: italic; }
    .error-msg { color: #dc2626; font-size: 13px; font-weight: 600; text-align: center; margin-top: 12px; display: none; }
  </style>
</head>

    { keywords: ['mangga'], name: 'Mangga', cal: 130, unit: 'buah' },
    { keywords: ['alpukat'], name: 'Alpukat', cal: 160, unit: 'buah' },

    // --- MINUMAN ---
    { keywords: ['teh tawar', 'air putih'], name: 'Teh Tawar / Air Putih', cal: 0, unit: 'gelas' },
    { keywords: ['kopi hitam', 'americano'], name: 'Kopi Hitam', cal: 5, unit: 'cangkir' },
    { keywords: ['jus murni', 'jus tanpa gula'], name: 'Jus Buah Murni', cal: 90, unit: 'gelas' },
    { keywords: ['kopi saset', 'kopi hitam manis', 'kopi manis'], name: 'Kopi Saset / Manis', cal: 100, unit: 'cangkir' },
    { keywords: ['es teh manis', 'es teh', 'teh manis'], name: 'Es Teh Manis', cal: 110, unit: 'gelas' },
    { keywords: ['es jeruk', 'nutrisari'], name: 'Es Jeruk', cal: 110, unit: 'gelas' },
    { keywords: ['jus apel', 'jus jeruk', 'jus buah naga', 'jus mangga', 'jus'], name: 'Jus Buah + Gula', cal: 160, unit: 'gelas' },
    { keywords: ['kopi susu', 'latte', 'gula aren'], name: 'Kopi Susu / Gula Aren', cal: 220, unit: 'gelas' },
    { keywords: ['jus alpukat', 'es buah', 'es teler', 'sop buah'], name: 'Jus Alpukat / Es Buah', cal: 300, unit: 'mangkuk' }
  ];

  function setMode(mode, btn) {
    currentMode = mode;
    var btns = document.querySelectorAll('.mode-btn');
    btns.forEach(function(b) { b.classList.remove('active'); });
    btn.classList.add('active');
  }

  function getSessionLimit(session, mode) {
    if (mode === 'defisit') {
      if (session.indexOf('Sarapan') !== -1) return { min: 300, max: 400 };
      if (session.indexOf('Siang') !== -1) return { min: 450, max: 550 };
      if (session.indexOf('Malam') !== -1) return { min: 350, max: 450 };
      return { min: 100, max: 200 };
    } else if (mode === 'surplus') {
      if (session.indexOf('Sarapan') !== -1) return { min: 500, max: 650 };
      if (session.indexOf('Siang') !== -1) return { min: 700, max: 850 };
      if (session.indexOf('Malam') !== -1) return { min: 600, max: 750 };
      return { min: 250, max: 350 };
    } else {
      if (session.indexOf('Sarapan') !== -1) return { min: 400, max: 500 };
      if (session.indexOf('Siang') !== -1) return { min: 600, max: 700 };
      if (session.indexOf('Malam') !== -1) return { min: 500, max: 600 };
      return { min: 150, max: 250 };
    }
  }

  function toTitleCase(str) {
    return str.replace(/\w\S*/g, function(txt){
      return txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase();
    });
  }

  function prosesHitung() {
    var textInput = document.getElementById('menuInput').value;
    var session = document.getElementById('session').value;
    var errorText = document.getElementById('errorText');
    var resultBox = document.getElementById('resultBox');
    
    errorText.style.display = "none";

    if(!textInput || !textInput.trim()) {
      alert("Isi dulu makanan/minuman/buah yang kamu makan ya!");
      return;
    }

    var segments = textInput.toLowerCase().split(/,|\n/);
    var totalCal = 0;
    var items = [];
    var suggestions = [];

    for (var s = 0; s < segments.length; s++) {
      var seg = segments[s].trim();
      if(!seg) continue;

      var qty = 1;
      var numMatch = seg.match(/\d+(\.\d+)?/);
      if (numMatch) {
        qty = parseFloat(numMatch[0]);
      }

      var found = false;
      for (var i = 0; i < foodDatabase.length; i++) {
        var food = foodDatabase[i];
        for (var k = 0; k < food.keywords.length; k++) {
          var kw = food.keywords[k];
          if (seg.indexOf(kw) !== -1) {
            var itemCal = food.cal * qty;
            
            var cleanText = seg.replace(/\d+(\.\d+)?/g, '').replace(/biji|pcs|tusuk|centong|porsi|potong|gelas|butir|ekor|cangkir|mangkuk/gi, '').trim();
            var displayName = cleanText ? toTitleCase(cleanText) : food.name;

            var labelName = displayName + " (" + qty + " " + (food.unit || 'porsi') + ")";
            
            items.push({ name: labelName, cal: itemCal });
            if (food.sug) suggestions.push(food.sug);
            found = true;
            break;
          }
        }
        if (found) break;
      }
    }

    if (items.length === 0) {
      errorText.style.display = "block";
      resultBox.style.display = "none";
      return;
    }

    var breakdownList = document.getElementById('breakdownList');
    breakdownList.innerHTML = "";
    
    for(var j = 0; j < items.length; j++) {
      totalCal += items[j].cal;
      var li = document.createElement('li');
      li.innerHTML = '<span>' + items[j].name + '</span><strong>' + items[j].cal + ' kcal</strong>';
      breakdownList.appendChild(li);
    }

    document.getElementById('sessionTitle').innerText = "Estimasi Total (" + session + " - Mode " + currentMode.toUpperCase() + ")";
    document.getElementById('totalCalDisplay').innerText = totalCal + " kcal";

    var limit = getSessionLimit(session, currentMode);
    var badge = document.getElementById('statusBadge');

    if (totalCal >= limit.min && totalCal <= limit.max) {
      badge.innerText = "PAS & AMAN! Sesuai Target Mode " + currentMode.toUpperCase() + " (" + limit.min + "-" + limit.max + " kcal)";
      badge.className = "badge badge-safe";
      
      if (currentMode === 'defisit') {
        suggestions.push("Hebat! Asupan porsi kamu berada di zona defisit ideal. Pertahankan asupan protein agar massa otot terjaga.");
      } else if (currentMode === 'surplus') {
        suggestions.push("Bagus! Kalori sesi ini pas untuk target surplus. Pastikan diimbangi dengan latihan beban agar jadi otot.");
      } else {
        suggestions.push("Porsi makan kamu sangat seimbang untuk mempertahankan berat badan ideal.");
      }
    } else if (totalCal > limit.max) {
      badge.innerText = "MELEBIHI TARGET MODE " + currentMode.toUpperCase() + " (Batas Max: " + limit.max + " kcal)";
      badge.className = "badge badge-over";

      if (currentMode === 'defisit') {
        suggestions.push("Asupan melebihi batas defisit. Solusi: Kurangi porsi nasi/santan di sesi makan berikutnya atau luangkan waktu jalan kaki 20–30 menit.");
        suggestions.push("Tips: Ganti minuman manis dengan air putih atau teh tawar untuk menghemat hingga 110–220 kcal.");
      } else if (currentMode === 'normal') {
        suggestions.push("Kalori sedikit di atas kebutuhan normal. Kurangi porsi camilan atau minyak gorengan di sesi makan berikutnya.");
      } else {
        suggestions.push("Kalori melebihi batas surplus sesi ini. Imbangi dengan minum air putih yang cukup dan hindari lemak jenuh berlebih.");
      }
    } else {
      badge.innerText = "DI BAWAH TARGET (" + limit.min + "-" + limit.max + " kcal)";
      badge.className = "badge badge-under";

      if (currentMode === 'surplus') {
        suggestions.push("Kalori masih jauh dari target surplus. Tambahkan makanan padat gizi seperti 1 buah pisang, alpukat, atau 1-2 butir telur rebus.");
        suggestions.push("Tips Surplus: Gunakan susu, kacang-kacangan, atau jus buah untuk menambah kalori tanpa membuat perut terlalu kenyang.");
      } else if (currentMode === 'normal') {
        suggestions.push("Kalori masih di bawah target normal harian. Kamu bisa menambah 1 porsi buah atau camilan sehat untuk memenuhi energi.");
      } else {
        suggestions.push("Kalori di bawah batas minimum sesi. Pastikan kamu tetap kenyang dan tidak lemas dalam beraktivitas.");
      }
    }

    var sugArea = document.getElementById('suggestionArea');
    var sugList = document.getElementById('suggestionList');
    sugList.innerHTML = "";

    if (suggestions.length > 0) {
      for(var s = 0; s < suggestions.length; s++) {
        var liSug = document.createElement('li');
        liSug.innerHTML = suggestions[s];
        sugList.appendChild(liSug);
      }
      sugArea.style.display = "block";
    } else {
      sugArea.style.display = "none";
    }

    resultBox.style.display = "block";
  }
</script>
